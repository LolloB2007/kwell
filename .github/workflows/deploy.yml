name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A new deploy supersedes any in-flight one; never cancel a deploy that
# is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Next.js project lives in the `web` workspace; everything
        # below this step runs from there.
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # The root package.json owns the lockfile (npm workspaces).
          cache-dependency-path: package-lock.json

      - name: Setup Pages
        # NOTE: do NOT pass `static_site_generator: next` — that helper
        # writes its own next.config.js into the project root, which
        # then overrides our next.config.ts (Next prefers .js). We own
        # basePath/assetPrefix in next.config.ts and don't need the
        # injection.
        uses: actions/configure-pages@v5

      - name: Install dependencies
        # Install at the workspace root so npm resolves the `web` workspace.
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Build (static export)
        # next.config.ts derives basePath from GITHUB_ACTIONS, but
        # NEXT_PUBLIC_BASE_PATH is what asset.ts uses to prefix /brand
        # paths (next/image with `unoptimized` does NOT apply basePath
        # to <img src> automatically). Keep both in sync.
        env:
          NEXT_PUBLIC_BASE_PATH: /kwell
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
